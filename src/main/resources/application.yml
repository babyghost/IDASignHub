# IDA SignHub Application Configuration
spring:
  application:
    name: ida-signhub
  profiles:
    active: prod

  # Web Server Configuration
  server:
    port: 8434
    servlet:
      context-path: ""
    compression:
      enabled: true
    error:
      whitelabel:
        enabled: false

  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  # Actuator Configuration
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
    endpoint:
      health:
        show-details: when-authorized

# IDA SignHub Specific Configuration
ida:
  sign:
    # Folder Configuration
    root-folder: ${user.home}/IDASignHub/app
    custom-folder: ${user.home}/IDASignHub
    folder-endpoint: "/processing"
    input-folder: "folder_filecanky"
    output-folder: "folder_filedakyso"
    temp-folder: "tmp"

    # USB Token Configuration
    usb-token-path: "config/token.jks"
    usb-token-password: "changeit"

    # Font Configuration
    font-path: "font/arial-unicode-ms.ttf"

    # Timestamp Configuration
    timestamp-url: "http://tsa.ca.gov.vn"

    # Image Configuration
    logo-path: "source/logo.png"
    quoc-huy-path: "source/quochuy.png"

    # Signing Configuration
    signing:
      default-width: 180
      default-height: 50
      default-font-size: 7
      default-location: "tren_phai"
      default-crypto-standard: "CMS"
      default-signature-type: "KY_SOHOA"
      default-show-type: 0

    # Server Configuration
    server:
      port: 8435
      context-path: ""
      auto-start: true

    # Application Configuration
    app:
      system-tray-enabled: true
      auto-start-with-windows: false
      minimize-to-tray: true
      language: "vi"

# Logging Configuration
logging:
  level:
    com.fpt.ida.idasignhub: INFO
    org.springframework: WARN
    org.apache: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${ida.sign.custom-folder}/logs/ida-signhub.log
    max-size: 10MB
    max-history: 30

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  # Development specific settings
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.fpt.ida.idasignhub: DEBUG
    org.springframework.web: DEBUG

ida:
  sign:
    app:
      system-tray-enabled: false
      minimize-to-tray: false

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.fpt.ida.idasignhub: INFO
    org.springframework: WARN

ida:
  sign:
    app:
      system-tray-enabled: true
      minimize-to-tray: true